<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Owns 1 symbols across 2 file(s).</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "api", "label": "api", "description": "Owns 11 symbols across 3 file(s)."}}, {"data": {"id": "baseline", "label": "baseline", "description": "Owns 10 symbols across 3 file(s)."}}, {"data": {"id": "cli", "label": "cli", "description": "Owns 1 symbols across 2 file(s).", "linkUrl": "./cli.html"}}, {"data": {"id": "evaluation", "label": "evaluation", "description": "Owns 10 symbols across 4 file(s)."}}, {"data": {"id": "graph", "label": "graph", "description": "Owns 21 symbols across 3 file(s)."}}, {"data": {"id": "llm", "label": "llm", "description": "Owns 9 symbols across 3 file(s)."}}, {"data": {"id": "replay", "label": "replay", "description": "Owns 14 symbols across 4 file(s)."}}, {"data": {"id": "rootcause", "label": "rootcause", "description": "Owns 8 symbols across 3 file(s)."}}, {"data": {"id": "rules", "label": "rules", "description": "Owns 19 symbols across 4 file(s)."}}, {"data": {"id": "sdk", "label": "sdk", "description": "Owns 47 symbols across 4 file(s)."}}, {"data": {"id": "storage", "label": "storage", "description": "Owns 16 symbols across 4 file(s)."}}, {"data": {"id": "ui", "label": "ui", "description": "Owns 4 symbols across 2 file(s).", "linkUrl": "./ui.html"}}], "edges": [{"data": {"id": "edge_0", "source": "api", "target": "storage", "label": "calls"}}, {"data": {"id": "edge_1", "source": "api", "target": "baseline", "label": "calls"}}, {"data": {"id": "edge_2", "source": "api", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_3", "source": "api", "target": "llm", "label": "calls"}}, {"data": {"id": "edge_4", "source": "api", "target": "replay", "label": "calls"}}, {"data": {"id": "edge_5", "source": "api", "target": "rootcause", "label": "calls"}}, {"data": {"id": "edge_6", "source": "api", "target": "rules", "label": "calls"}}, {"data": {"id": "edge_7", "source": "sdk", "target": "storage", "label": "calls"}}, {"data": {"id": "edge_8", "source": "storage", "target": "sdk", "label": "calls"}}, {"data": {"id": "edge_9", "source": "ui", "target": "sdk", "label": "calls"}}, {"data": {"id": "edge_10", "source": "ui", "target": "baseline", "label": "calls"}}, {"data": {"id": "edge_11", "source": "ui", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_12", "source": "ui", "target": "replay", "label": "calls"}}, {"data": {"id": "edge_13", "source": "ui", "target": "rootcause", "label": "calls"}}, {"data": {"id": "edge_14", "source": "ui", "target": "rules", "label": "calls"}}, {"data": {"id": "edge_15", "source": "baseline", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_16", "source": "baseline", "target": "rules", "label": "calls"}}, {"data": {"id": "edge_17", "source": "cli", "target": "api", "label": "calls"}}, {"data": {"id": "edge_18", "source": "cli", "target": "storage", "label": "calls"}}, {"data": {"id": "edge_19", "source": "cli", "target": "baseline", "label": "calls"}}, {"data": {"id": "edge_20", "source": "cli", "target": "evaluation", "label": "calls"}}, {"data": {"id": "edge_21", "source": "cli", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_22", "source": "cli", "target": "llm", "label": "calls"}}, {"data": {"id": "edge_23", "source": "cli", "target": "replay", "label": "calls"}}, {"data": {"id": "edge_24", "source": "cli", "target": "rootcause", "label": "calls"}}, {"data": {"id": "edge_25", "source": "cli", "target": "rules", "label": "calls"}}, {"data": {"id": "edge_26", "source": "replay", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_27", "source": "replay", "target": "rules", "label": "calls"}}, {"data": {"id": "edge_28", "source": "rootcause", "target": "baseline", "label": "calls"}}, {"data": {"id": "edge_29", "source": "rootcause", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_30", "source": "rootcause", "target": "rules", "label": "calls"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
